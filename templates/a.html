
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール入力</title>
</head>
<body>
    乱数は{{rmd}}です
    <h1>名前と年齢はなんですか？</h1>

    <form action="/profile" method="POST">
        <div>
            <label for="name">名前：</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="山田太郎"
                required
            >
        </div>

        <div>
            <label for="age">年齢：</label>
            <input
                type="number"
                id="age"
                name="age"
                placeholder="20"
                min="0"
                required
            >
        </div>

        <button type="submit">送信する</button>
    </form>
</body>
</html>
